# ===================================
# SonarCloud Configuration - F4U Frontend
# ===================================

# Metadata
sonar.projectKey=F4U-Company_F4U-Frontend
sonar.organization=f4u-company
sonar.projectName=F4U Frontend
sonar.projectVersion=1.0.0

# Source code
sonar.sources=src
sonar.tests=src/test
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# Encoding
sonar.sourceEncoding=UTF-8

# JavaScript/TypeScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/public/**,**/*.config.js,src/main.jsx,src/authConfig.js

# Coverage exclusions
sonar.coverage.exclusions=**/node_modules/**,**/test/**,**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,**/*.config.js,src/main.jsx,src/authConfig.js

# Quality Gate
sonar.qualitygate.wait=true
