# Crea un workflow limpio y simple
$workflowContent = @'
name: 🚀 Deploy to AWS S3 Demo

on:
  push:
    branches: [main]
  workflow_dispatch:  # Permite ejecución manual

jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: 📚 Install dependencies
      run: npm ci

    - name: ⚙️ Configure Demo Environment
      run: |
        echo "VITE_API_URL=http://18.220.74.7:5000/api" > .env
        echo "Configuración de entorno lista ✅"

    - name: 🔨 Build React App
      run: |
        npm run build
        echo "Build completado ✅"

    - name: 🔐 Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: ☁️ Upload to S3
      run: |
        echo "Subiendo archivos a S3..."
        aws s3 sync dist/ s3://f4u-frontend-demo --delete --acl public-read
        echo "✅ Archivos subidos"

    - name: 🌐 Configure Static Hosting
      run: |
        echo "Configurando hosting estático..."
        aws s3 website s3://f4u-frontend-demo \
          --index-document index.html \
          --error-document index.html
        echo "✅ Hosting configurado"

    - name: ✅ Verify Deployment
      run: |
        echo "=========================================="
        echo "🚀 ¡DESPLIEGUE COMPLETADO!"
        echo "=========================================="
        echo "🌐 URL de tu aplicación:"
        echo "   http://f4u-frontend-demo.s3-website.us-east-2.amazonaws.com"
        echo ""
        echo "🔗 Backend EC2:"
        echo "   http://18.220.74.7:5000/api"
        echo ""
        echo "📊 Para verificar:"
        echo "   1. Abre la URL en tu navegador"
        echo "   2. Presiona F12 → Console"
        echo "   3. Deberías ver la aplicación React"
        echo "=========================================="
'@

# Guarda el workflow
$workflowContent | Out-File -FilePath .github\workflows\deploy-demo.yml -Encoding UTF8

Write-Host "✅ Workflow creado: .github\workflows\deploy-demo.yml" -ForegroundColor Green