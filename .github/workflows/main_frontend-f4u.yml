name: 🚀 Deploy front -> S3 (f4u-frontend-demo)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node 18 es más estable con Vite 7
        node-version: [18.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Clean install with Rollup Linux fix
        run: |
          echo "🧹 Limpiando instalación previa..."
          # Eliminar lockfile problemático
          rm -rf node_modules package-lock.json
          
          echo "🔧 Solución específica para bug de Rollup en Linux..."
          # Solución 1: Instalar dependencias sin binarios opcionales primero
          npm ci --ignore-scripts --no-optional
          
          echo "📦 Instalando binario nativo de Rollup para Linux..."
          # Solución 2: Instalar explícitamente el binario Linux
          npm install @rollup/rollup-linux-x64-gnu@4.52.4 --save-optional --no-save
          
          echo "🔄 Reconstruyendo dependencias nativas..."
          # Solución 3: Reconstruir módulos nativos
          npm rebuild
          
          echo "✅ Verificando instalación..."
          ls -la node_modules/.bin/ | grep -i rollup || echo "Binarios de Rollup no encontrados"
          npx rollup --version 2>/dev/null || echo "Rollup no ejecutable (esto puede ser normal)"

      - name: Create .env.production (Vite env)
        run: |
          echo "VITE_API_URL=https://d34hoxniq2n0jw.cloudfront.net" > .env.production
          
          # Azure AD vars
          echo "VITE_AZURE_CLIENT_ID=0758e3c8-a43d-4957-a829-8d92f911ad31" >> .env.production
          echo "VITE_AZURE_API_CLIENT_ID=dce7b0a8-1f73-483e-a684-f5f3d8c2f713" >> .env.production
          echo "VITE_AZURE_AUTHORITY=https://login.microsoftonline.com/common" >> .env.production
          echo "VITE_AZURE_REDIRECT_URI=https://d34hoxniq2n0jw.cloudfront.net/" >> .env.production
          echo "VITE_AZURE_POST_LOGOUT_REDIRECT_URI=https://d34hoxniq2n0jw.cloudfront.net/" >> .env.production
          echo "VITE_AZURE_API_SCOPE=api://0758e3c8-a43d-4957-a829-8d92f911ad31/access_as_user" >> .env.production
          
          echo "✅ Archivo .env.production creado"

      - name: Build (Vite) - Solución alternativa
        env:
          NODE_ENV: production
          # Variable específica para evitar bug de Rollup
          ROLLUP_NATIVE_LINUX_OVERRIDE: 1
        run: |
          echo "🏗️ Iniciando build de Vite..."
          echo "=== Usando workaround para Rollup ==="
          
          # Workaround: Forzar uso de versión JavaScript pura de Rollup
          # Eliminar referencias a binarios nativos problemáticos
          find node_modules -name "native.js" -type f | head -5
          
          echo "=== Ejecutando npm run build ==="
          # Build con output verbose para debug
          npm run build 2>&1 | tail -50
          
          echo "📁 Verificando resultado..."
          if [ -d "dist" ]; then
            echo "✅ BUILD EXITOSO - Carpeta dist creada"
            ls -la dist/
          else
            echo "❌ ERROR: No se creó carpeta dist"
            echo "=== Últimos logs de error ==="
            # Intentar obtener más info del error
            npm run build 2>&1 | grep -A 10 -B 10 "Error\|error\|at"
            exit 1
          fi

      - name: Show build output
        run: |
          if [ -d "dist" ]; then 
            echo "📦 Contenido del build:"
            find dist -type f -name "*.js" -o -name "*.css" -o -name "*.html" | head -20
            echo "📄 Tamaño de index.html:"
            wc -l dist/index.html
          else
            echo "❌ ERROR CRÍTICO: No hay carpeta dist"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Empty S3 bucket before upload
        run: |
          aws s3 rm s3://f4u-frontend-demo --recursive || true
          echo "🗑 Bucket limpiado"

      - name: Sync build to S3
        run: |
          BUILD_DIR="dist"
          if [ ! -d "$BUILD_DIR" ]; then
            echo "❌ ERROR: No se encontró carpeta $BUILD_DIR"
            echo "Contenido actual del directorio:"
            ls -la
            exit 1
          fi
          
          echo "📤 Sincronizando $BUILD_DIR/ a S3..."
          aws s3 sync "$BUILD_DIR/" s3://f4u-frontend-demo --delete
          echo "✅ Archivos desplegados en S3"

      - name: Configure S3 website + policy
        run: |
          aws s3 website s3://f4u-frontend-demo --index-document index.html --error-document index.html || true
          
          echo '{
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"PublicReadGetObject",
                "Effect":"Allow",
                "Principal":"*",
                "Action":"s3:GetObject",
                "Resource":"arn:aws:s3:::f4u-frontend-demo/*"
              }
            ]
          }' > /tmp/f4u_policy.json
          
          aws s3api put-bucket-policy --bucket f4u-frontend-demo --policy file:///tmp/f4u_policy.json || true
          echo "🔓 Política pública aplicada"

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "⚠️ No se encontró CLOUDFRONT_DISTRIBUTION_ID en secrets"
            exit 0
          fi
          
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
          echo "🌀 CloudFront invalidado"

      - name: Finish
        run: |
          echo "🎉 DEPLOY COMPLETADO EXITOSAMENTE"
          echo "🌐 URL de producción: https://d34hoxniq2n0jw.cloudfront.net"
          echo "📅 Fecha: $(date)"
          echo "🔄 Node.js: $(node --version)"
          echo "📦 npm: $(npm --version)"