name: 🚀 Deploy front -> S3 (f4u-frontend-demo)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Vite env (fixed CloudFront URL)
        run: |
          # -> FIX: VITE_API_URL estática (sin /api final)
          echo "VITE_API_URL=https://d34hoxniq2n0jw.cloudfront.net" > .env.production
          echo "VITE_API_URL=https://d34hoxniq2n0jw.cloudfront.net" > .env
          echo "✅ Variables creadas (fijas): VITE_API_URL=https://d34hoxniq2n0jw.cloudfront.net"

      - name: Build (Vite)
        run: npm run build

      - name: Show build output (debug)
        run: |
          if [ -d "dist" ]; then ls -la dist; else ls -la build || true; fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: (Optional but recommended) Empty S3 bucket before upload
        run: |
          # BORRA todo el contenido del bucket para evitar archivos antiguos en S3
          aws s3 rm s3://f4u-frontend-demo --recursive || true
          echo "✅ Bucket limpiado (si existían archivos antiguos)"

      - name: Sync build to S3
        run: |
          if [ -d "dist" ]; then BUILD_DIR="dist"; else BUILD_DIR="build"; fi
          aws s3 sync "$BUILD_DIR/" s3://f4u-frontend-demo --delete
          echo "✅ Archivos sincronizados con S3"

      - name: Configure S3 website + policy
        run: |
          aws s3 website s3://f4u-frontend-demo --index-document index.html --error-document index.html || true
          echo '{
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"PublicReadGetObject",
                "Effect":"Allow",
                "Principal":"*",
                "Action":"s3:GetObject",
                "Resource":"arn:aws:s3:::f4u-frontend-demo/*"
              }
            ]
          }' > /tmp/f4u_policy.json
          aws s3api put-bucket-policy --bucket f4u-frontend-demo --policy file:///tmp/f4u_policy.json || true
          echo "✅ Configuración de S3 completada"

      - name: Check CloudFront API reachability
        run: |
          echo "Probando conexión a API vía CloudFront..."
          # Probar el health endpoint a través de CloudFront (esto puede devolver 401 si requiere auth)
          curl -I --max-time 10 https://d34hoxniq2n0jw.cloudfront.net/api/health \
            && echo "✅ API accesible (CloudFront)" \
            || echo "⚠️ API no accesible desde runner vía CloudFront (ok si requiere auth)"

      - name: Invalidate CloudFront cache
        run: |
          echo "Invalidando caché de CloudFront..."
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "✅ Invalidación iniciada"

      - name: Finish
        run: |
          echo "🎉 DEPLOY COMPLETADO EXITOSAMENTE"
          echo ""
          echo " URLs de acceso:"
          echo "  • Frontend (S3): http://f4u-frontend-demo.s3-website.us-east-2.amazonaws.com"
          echo "  • Frontend (CloudFront): https://d34hoxniq2n0jw.cloudfront.net"
          echo "  • API Backend (via CloudFront): https://d34hoxniq2n0jw.cloudfront.net/api"
          echo ""
          echo " La invalidación de caché puede tardar 1-2 minutos en propagarse"
