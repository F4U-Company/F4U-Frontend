name: 🚀 Deploy front -> S3 (f4u-frontend-demo)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Vite env (point to CloudFront)  # ✅ CAMBIADO
        run: |
          # Usa la variable de GitHub configurada
          echo "VITE_API_URL=${{ vars.VITE_API_URL }}" > .env.production
          echo "VITE_API_URL=${{ vars.VITE_API_URL }}" > .env

      - name: Build (Vite)
        run: npm run build

      - name: Show build output (debug)
        run: |
          if [ -d "dist" ]; then ls -la dist; else ls -la build || true; fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Sync build to S3
        run: |
          if [ -d "dist" ]; then BUILD_DIR="dist"; else BUILD_DIR="build"; fi
          aws s3 sync "$BUILD_DIR/" s3://f4u-frontend-demo --delete
          aws s3 ls s3://f4u-frontend-demo --recursive | head -n 20 || true

      - name: Configure S3 website + policy
        run: |
          aws s3 website s3://f4u-frontend-demo --index-document index.html --error-document index.html || true
          
          echo '{
            "Version":"2012-10-17",
            "Statement":[
              {
                "Sid":"PublicReadGetObject",
                "Effect":"Allow",
                "Principal":"*",
                "Action":"s3:GetObject",
                "Resource":"arn:aws:s3:::f4u-frontend-demo/*"
              }
            ]
          }' > /tmp/f4u_policy.json
          
          aws s3api put-bucket-policy --bucket f4u-frontend-demo --policy file:///tmp/f4u_policy.json || true

      - name: Check CloudFront API reachability  # ✅ CAMBIADO
        run: |
          curl -I --max-time 10 https://d34hoxniq2n0jw.cloudfront.net/api/health || echo "CloudFront API no disponible desde runner"

      - name: Invalidate CloudFront cache  # ✅ AÑADIR ESTE STEP
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"

      - name: Finish
        run: |
          echo "✅ Frontend desplegado en S3"
          echo "🌐 URL del Frontend (S3): http://f4u-frontend-demo.s3-website.us-east-2.amazonaws.com"
          echo "☁️  URL del Frontend (CloudFront): https://d34hoxniq2n0jw.cloudfront.net"
          echo "🔗 API Backend (via CloudFront): https://d34hoxniq2n0jw.cloudfront.net/api"