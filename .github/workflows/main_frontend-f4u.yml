name: 🚀 Deploy front -> S3 (f4u-frontend-demo)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create Vite env (point to EC2 backend)
        run: |
          echo "VITE_API_URL=http://ec2-18-220-74-7.us-east-2.compute.amazonaws.com:5000/api" > .env.production
          echo "VITE_API_URL=http://ec2-18-220-74-7.us-east-2.compute.amazonaws.com:5000/api" > .env

      - name: Build (Vite)
        run: npm run build

      - name: Show build output (debug)
        run: |
          if [ -d "dist" ]; then ls -la dist; else ls -la build || true; fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Sync build to S3
        run: |
          if [ -d "dist" ]; then BUILD_DIR="dist"; else BUILD_DIR="build"; fi
          aws s3 sync "$BUILD_DIR/" s3://f4u-frontend-demo --delete --acl public-read
          aws s3 ls s3://f4u-frontend-demo --recursive | head -n 20 || true

      - name: Configure S3 website + policy
        run: |
          aws s3 website s3://f4u-frontend-demo --index-document index.html --error-document index.html || true
          cat > /tmp/f4u_policy.json <<'POL'
{
  "Version":"2012-10-17",
  "Statement":[
    {
      "Sid":"PublicReadGetObject",
      "Effect":"Allow",
      "Principal":"*",
      "Action":"s3:GetObject",
      "Resource":"arn:aws:s3:::f4u-frontend-demo/*"
    }
  ]
}
POL
          aws s3api put-bucket-policy --bucket f4u-frontend-demo --policy file:///tmp/f4u_policy.json || true

      - name: Check backend reachability (no-falla)
        run: |
          curl -I --max-time 10 http://18.220.74.7:5000/api/health || echo "Backend no disponible desde runner"

      - name: Finish
        run: |
          echo "Frontend: http://f4u-frontend-demo.s3-website.us-east-2.amazonaws.com"
          echo "Backend: http://ec2-18-220-74-7.us-east-2.compute.amazonaws.com:5000/api"
